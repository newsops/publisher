services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
    ports:
      - '127.0.0.1:${PUBLISHER_FIXTURE_POSTGRES_PORT:-55432}:5432'
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/001-publisher.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 2s
      retries: 30

  object-storage:
    build:
      context: .
      dockerfile: Dockerfile
      target: minio-server
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: publisher-local
      MINIO_ROOT_PASSWORD: publisher-local-secret
    ports:
      - '127.0.0.1:${PUBLISHER_FIXTURE_OBJECT_PORT:-59000}:9000'
      - '127.0.0.1:${PUBLISHER_FIXTURE_CONSOLE_PORT:-59001}:9001'

  object-storage-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: minio-client
    depends_on:
      - object-storage
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://object-storage:9000 publisher-local publisher-local-secret;
        do sleep 1; done;
        mc mb --ignore-existing local/publisher-fixture

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local-only
    ports:
      - '55432:5432'
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/001-publisher.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 2s
      retries: 30

  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: publisher-local
      MINIO_ROOT_PASSWORD: publisher-local-secret
    ports:
      - '59000:9000'
      - '59001:9001'

  object-storage-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - object-storage
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://object-storage:9000 publisher-local publisher-local-secret;
        do sleep 1; done;
        mc mb --ignore-existing local/publisher-fixture

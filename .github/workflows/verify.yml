name: verify

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # RULE-003: hosting integrations report asynchronously; re-check daily.
    - cron: '17 3 * * *'

jobs:
  repository:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # RULE-003: the pull-request commit range needs the base history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # RULE-003: the operator's private denylist arrives as an optional
      # secret and is written to a file outside the checkout. Without it the
      # privacy scan runs its generic checks and says so.
      - name: Private denylist
        env:
          DENYLIST_TEXT: ${{ secrets.PUBLISHER_PRIVATE_DENYLIST_TEXT }}
        run: |
          if [ -n "$DENYLIST_TEXT" ]; then
            printf '%s\n' "$DENYLIST_TEXT" > "$RUNNER_TEMP/private-denylist.txt"
            chmod 600 "$RUNNER_TEMP/private-denylist.txt"
            printf 'PUBLISHER_PRIVATE_DENYLIST=%s\n' "$RUNNER_TEMP/private-denylist.txt" >> "$GITHUB_ENV"
          fi
      - name: Pull-request text and commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/harness/scan-repository-privacy.mjs --text-env PR_TITLE --text-env PR_BODY --commit-range "origin/$BASE_REF..HEAD"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: corepack pnpm build:admin
      - run: corepack pnpm build:comments
      - run: corepack pnpm harness:scan

  github-records:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      statuses: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Private denylist
        env:
          DENYLIST_TEXT: ${{ secrets.PUBLISHER_PRIVATE_DENYLIST_TEXT }}
        run: |
          if [ -n "$DENYLIST_TEXT" ]; then
            printf '%s\n' "$DENYLIST_TEXT" > "$RUNNER_TEMP/private-denylist.txt"
            chmod 600 "$RUNNER_TEMP/private-denylist.txt"
            printf 'PUBLISHER_PRIVATE_DENYLIST=%s\n' "$RUNNER_TEMP/private-denylist.txt" >> "$GITHUB_ENV"
          fi
      - name: No hosting records in the GitHub project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Hosting integrations report on the pull-request head, not on the
          # merge commit the workflow checks out.
          RECORDS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/harness/check-github-records.mjs

  clean-room:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: docker compose -f infra/local/compose.yml up -d --wait postgres object-storage
      - run: docker compose -f infra/local/compose.yml run --rm object-storage-init
      - run: corepack pnpm clean-room:smoke
        env:
          DATABASE_URL: postgresql://publisher_admin_app:admin-local-only@127.0.0.1:55432/publisher_admin
          COMMENTS_DATABASE_URL: postgresql://publisher_comments_app:comments-local-only@127.0.0.1:55432/publisher_comments
          RESTORE_DATABASE_URL: postgresql://publisher_admin_app:admin-local-only@127.0.0.1:55432/publisher_admin_restore
          COMMENTS_RESTORE_DATABASE_URL: postgresql://publisher_comments_app:comments-local-only@127.0.0.1:55432/publisher_comments_restore
          OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:59000
          OBJECT_STORAGE_REGION: us-east-1
          OBJECT_STORAGE_BUCKET: publisher-fixture
          OBJECT_STORAGE_ACCESS_KEY_ID: publisher-local
          OBJECT_STORAGE_SECRET_ACCESS_KEY: publisher-local-secret
          OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
      - if: always()
        run: docker compose -f infra/local/compose.yml down -v

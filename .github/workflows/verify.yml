name: verify

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # RULE-003: hosting integrations report asynchronously; re-check daily.
    - cron: '17 3 * * *'

jobs:
  repository:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # RULE-003: the pull-request commit range needs the base history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # RULE-003: the operator's private denylist arrives as an optional
      # secret and is written to a file outside the checkout. Without it the
      # privacy scan runs its generic checks and says so.
      - name: Private denylist
        env:
          DENYLIST_TEXT: ${{ secrets.PUBLISHER_PRIVATE_DENYLIST_TEXT }}
        run: |
          if [ -n "$DENYLIST_TEXT" ]; then
            printf '%s\n' "$DENYLIST_TEXT" > "$RUNNER_TEMP/private-denylist.txt"
            chmod 600 "$RUNNER_TEMP/private-denylist.txt"
            printf 'PUBLISHER_PRIVATE_DENYLIST=%s\n' "$RUNNER_TEMP/private-denylist.txt" >> "$GITHUB_ENV"
          fi
      - name: Pull-request text and commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/harness/scan-repository-privacy.mjs --text-env PR_TITLE --text-env PR_BODY --commit-range "origin/$BASE_REF..HEAD"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: corepack pnpm build:admin
      - run: corepack pnpm build:comments
      - run: corepack pnpm harness:scan

  github-records:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      statuses: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Private denylist
        env:
          DENYLIST_TEXT: ${{ secrets.PUBLISHER_PRIVATE_DENYLIST_TEXT }}
        run: |
          if [ -n "$DENYLIST_TEXT" ]; then
            printf '%s\n' "$DENYLIST_TEXT" > "$RUNNER_TEMP/private-denylist.txt"
            chmod 600 "$RUNNER_TEMP/private-denylist.txt"
            printf 'PUBLISHER_PRIVATE_DENYLIST=%s\n' "$RUNNER_TEMP/private-denylist.txt" >> "$GITHUB_ENV"
          fi
      - name: No hosting records in the GitHub project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Hosting integrations report on the pull-request head, not on the
          # merge commit the workflow checks out.
          RECORDS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/harness/check-github-records.mjs

  clean-room:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: publisher-fixture-${{ github.run_id }}-${{ github.run_attempt }}-clean-room
      PUBLISHER_FIXTURE_POSTGRES_PORT: '0'
      PUBLISHER_FIXTURE_OBJECT_PORT: '0'
      PUBLISHER_FIXTURE_CONSOLE_PORT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: docker compose -f infra/local/compose.yml up -d --wait postgres object-storage
      - name: Discover fixture endpoints
        shell: bash
        run: |
          set -euo pipefail
          fixture_address() {
            local mapping port
            mapping="$(docker compose -f infra/local/compose.yml port "$1" "$2" && printf '.')" || return
            mapping="${mapping%.}"
            mapping="${mapping%$'\n'}"
            if [[ ! "$mapping" =~ ^127\.0\.0\.1:([0-9]{1,5})$ ]]; then
              printf 'Invalid fixture mapping for %s:%s\n' "$1" "$2" >&2
              return 1
            fi
            port="${BASH_REMATCH[1]}"
            if (( 10#$port < 1 || 10#$port > 65535 )); then
              printf 'Invalid fixture port for %s:%s\n' "$1" "$2" >&2
              return 1
            fi
            printf '%s\n' "$mapping"
          }
          postgres_address="$(fixture_address postgres 5432)"
          object_address="$(fixture_address object-storage 9000)"
          console_address="$(fixture_address object-storage 9001)"
          {
            printf 'PUBLISHER_RECOVERY_TEST_DATABASE_URL=postgresql://postgres:postgres-local-only@%s/postgres\n' "$postgres_address"
            printf 'DATABASE_URL=postgresql://publisher_admin_app:admin-local-only@%s/publisher_admin\n' "$postgres_address"
            printf 'COMMENTS_DATABASE_URL=postgresql://publisher_comments_app:comments-local-only@%s/publisher_comments\n' "$postgres_address"
            printf 'RESTORE_DATABASE_URL=postgresql://publisher_admin_app:admin-local-only@%s/publisher_admin_restore\n' "$postgres_address"
            printf 'COMMENTS_RESTORE_DATABASE_URL=postgresql://publisher_comments_app:comments-local-only@%s/publisher_comments_restore\n' "$postgres_address"
            printf 'OBJECT_STORAGE_ENDPOINT=http://%s\n' "$object_address"
          } >> "$GITHUB_ENV"
      - name: Independent-connection recovery regression
        # The fixture creates and removes its own database on this disposable server.
        run: corepack pnpm exec vitest run --config vitest.harness.config.ts scripts/harness/__tests__/logical-recovery-contract.test.mjs scripts/harness/__tests__/archive-starter-safety.test.mjs
      - run: docker compose -f infra/local/compose.yml run --rm object-storage-init
      - run: corepack pnpm clean-room:smoke
        env:
          OBJECT_STORAGE_REGION: us-east-1
          OBJECT_STORAGE_BUCKET: publisher-fixture
          OBJECT_STORAGE_ACCESS_KEY_ID: publisher-local
          OBJECT_STORAGE_SECRET_ACCESS_KEY: publisher-local-secret
          OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
      - if: always()
        run: docker compose -f infra/local/compose.yml down -v
